{{- $image := partialCached "blog/image.html" . .RelPermalink -}}
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description | default (.Summary | plainify | htmlUnescape) }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:image" content="{{ $image.url }}">
<meta property="og:image:alt" content="{{ $image.alt }}">
{{ with $image.width }}<meta property="og:image:width" content="{{ . }}">{{ end }}
{{ with $image.height }}<meta property="og:image:height" content="{{ . }}">{{ end }}
{{ with .PublishDate }}<meta property="article:published_time" content="{{ .Format "2006-01-02T15:04:05-07:00" }}">{{ end }}
{{ with .Lastmod }}<meta property="article:modified_time" content="{{ .Format "2006-01-02T15:04:05-07:00" }}">{{ end }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Description | default (.Summary | plainify | htmlUnescape) }}">
<meta name="twitter:image" content="{{ $image.url }}">
<meta name="twitter:image:alt" content="{{ $image.alt }}">
