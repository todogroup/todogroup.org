<aside class="ospochi" aria-label="OSPochi community companion" hidden>
  <div class="ospochi__panel" id="ospochi-panel" hidden>
    <p class="ospochi__eyebrow">Your little TODO companion</p>
    <h2>Hi, I’m OSPochi!</h2>
    <p>Where shall we explore?</p>
    <nav aria-label="OSPochi shortcuts">
      <a href="{{ relLangURL "/resources/guides/" }}">Find a TODO guide <span aria-hidden="true">↗</span></a>
      <a href="{{ relLangURL "/community/ambassadors/" }}">Meet the community <span aria-hidden="true">↗</span></a>
      <a href="{{ relLangURL "/working-groups/" }}">Build something together <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
  <div class="ospochi__perch">
    <button type="button" class="ospochi__hide" aria-label="Hide OSPochi" title="Hide until the page reloads">×</button>
    <span class="ospochi__hint" aria-hidden="true">Explore with me</span>
    <button type="button" class="ospochi__launcher" aria-label="Explore with OSPochi" aria-expanded="false" aria-controls="ospochi-panel">
      <img src="{{ "img/ospochi/pixel-companion.png" | relURL }}" alt="" width="112" height="112" decoding="async">
    </button>
  </div>
</aside>
<button type="button" class="ospochi-restore" hidden>Bring back OSPochi</button>
