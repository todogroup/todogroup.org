subhero:
  other: Open Source Program Office の設立、拡大、支援に取り組む実践者のために
explainerText:
  other: |-
    組織におけるオープンソース管理と、実際の組織で広がる AI ガバナンスのベストプラクティスを共有する、ベンダーに中立な、誰にでも開かれた実践者のコミュニティです。

    Linux Foundation がホストする TODO Group は、組織を越えた実践的な導入、連携、協力を支える資料とガイドをつくっています。
