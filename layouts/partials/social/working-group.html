{{- $image := partialCached "social/working-group-image.html" . .RelPermalink -}}
{{- $description := .Description | default (.Summary | plainify | htmlUnescape | truncate 160) -}}
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:image" content="{{ $image.url }}">
<meta property="og:image:alt" content="{{ $image.alt }}">
{{ with $image.width }}<meta property="og:image:width" content="{{ . }}">{{ end }}
{{ with $image.height }}<meta property="og:image:height" content="{{ . }}">{{ end }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ $description }}">
<meta name="twitter:image" content="{{ $image.url }}">
<meta name="twitter:image:alt" content="{{ $image.alt }}">
